services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetpro123}
      POSTGRES_DB: ${POSTGRES_DB:-vetpro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetpro} -d ${POSTGRES_DB:-vetpro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./vetpro-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-vetpro-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vetpro}:${POSTGRES_PASSWORD:-vetpro123}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vetpro}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./vetpro-front
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000/api}
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
