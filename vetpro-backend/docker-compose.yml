version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: vetpro-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: vetpro
    ports:
      - "5432:5432"
    volumes:
      - vetpro_data:/var/lib/postgresql/data

volumes:
  vetpro_data:
